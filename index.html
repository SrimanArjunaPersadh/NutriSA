<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}

body{background:var(--bg);color:var(--text);font-family:var(--fb);font-size:14px;min-height:100vh}
.app{max-width:960px;margin:0 auto;padding:16px 16px 40px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}

.tile::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:2px 2px 0 0}
.tb::after{background:linear-gradient(90deg,#0066FF,#33A1FF)}.tg::after{background:linear-gradient(90deg,#22C55E,#16A34A)}

.mbar{margin-bottom:12px}.mbar:last-child{margin-bottom:0}
.mbhdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.mbname{font-family:var(--fh);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.mbnums{font-size:12px;color:var(--text3)}.mbnums b{color:var(--text);font-weight:600}
.track{height:6px;background:var(--bg5);border-radius:3px;overflow:hidden}
.fill{height:100%;border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1)}

input:focus,select:focus{border-color:var(--blue)}input::placeholder{color:var(--text3)}
.fl{font-family:var(--fh);font-size:10px;font-weight:700;color:var(--text3);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.8px}
.fr{display:grid;gap:8px;margin-bottom:10px}.fr2{grid-template-columns:1fr 1fr}

.bb{background:var(--blue);color:#fff}.bb:hover{background:var(--blue2)}.bsm{padding:6px 14px;font-size:12px}.bfw{width:100%}

.wval2{font-family:var(--fh);font-size:18px;font-weight:800;font-style:italic}
.wd2{font-family:var(--fh);font-size:13px;font-weight:700}.dn{color:var(--green)}.up{color:var(--red)}
.delbtn{background:transparent;border:1px solid var(--border2);border-radius:6px;color:var(--text3);cursor:pointer;font-size:10px;padding:3px 8px;margin-left:6px;transition:all .15s}

.mname{font-weight:600;font-size:13px}.mtime{font-size:10px;color:var(--text3);margin-top:1px}
.mkcal{font-family:var(--fh);font-size:15px;font-weight:700}.mmsub{font-size:10px;color:var(--text3);text-align:right;margin-top:1px}
.ttabs{display:flex;gap:3px;background:var(--bg3);border-radius:9px;padding:3px;width:fit-content}
.ttab{padding:5px 13px;border-radius:7px;border:none;background:transparent;color:var(--text3);cursor:pointer;font-family:var(--fh);font-size:13px;font-weight:700;text-transform:uppercase;transition:all .15s}
.ttab.on{background:var(--bg5);color:var(--text);border:1px solid var(--border2)}
.lgnd{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
.li{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3)}.ld{width:12px;height:2px;border-radius:1px}
.goal-strip{background:linear-gradient(135deg,#0D1929,#0a1520);border:1px solid #0066FF22;border-radius:var(--r);padding:18px 22px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.meal-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);margin-bottom:8px;overflow:hidden;transition:border-color .15s}

.meal-card-header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer;transition:background .15s}
.meal-card-header:hover{background:var(--bg4)}
.meal-card-name{font-family:var(--fh);font-size:16px;font-weight:800;font-style:italic}
.mcm{font-size:11px;color:var(--text3)}.mcm.pro{color:var(--protein)}.mcm.carb{color:var(--carbs)}.mcm.fat{color:var(--fats)}
.addmeal-btn{background:var(--blue);color:#fff;border:none;border-radius:6px;padding:5px 12px;font-family:var(--fh);font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap}
.addmeal-btn:hover{background:var(--blue2)}.chevron{font-size:12px;color:var(--text3);transition:transform .2s;margin-left:8px;display:inline-block}
.meal-card-body{display:none;padding:0 14px 14px;border-top:1px solid var(--border)}.meal-card-body.open{display:block}
.meal-note-strip{background:var(--bg4);border-radius:6px;padding:7px 10px;font-size:11px;color:var(--text3);margin:10px 0 8px;line-height:1.5}
.ing-table{width:100%;border-collapse:collapse;margin-top:4px}

.ing-table td{padding:7px 0;border-bottom:1px solid var(--border);font-size:12px;vertical-align:middle}.ing-table tr:last-child td{border-bottom:none}

.ing-total-nums{display:flex;gap:12px}.itn{font-size:12px;font-weight:600}
.ms-badge{display:inline-flex;align-items:center;gap:5px;background:#22C55E18;border:1px solid #22C55E44;border-radius:20px;padding:3px 10px 3px 7px;font-family:var(--fh);font-size:12px;font-weight:700;color:var(--green);margin-left:10px}

.search-wrap{position:relative;margin-bottom:12px}
.search-wrap input{padding-left:34px}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;pointer-events:none}
.search-result{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);margin-bottom:5px;cursor:pointer;transition:all .15s}
.search-result:hover{border-color:var(--blue);background:var(--bg4)}
.sr-name{font-family:var(--fh);font-size:14px;font-weight:800;font-style:italic;color:var(--text)}
.sr-match{font-size:10px;color:var(--blue);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-top:1px}
.sr-macros{font-size:11px;color:var(--text3);margin-top:2px}
.no-res{text-align:center;padding:16px;color:var(--text3);font-size:12px}
.ing-editor{width:100%;border-collapse:collapse;margin-top:6px}
.ing-editor th{font-family:var(--fh);font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;padding:4px 0;border-bottom:1px solid var(--border);text-align:left}
.ing-editor th:not(:first-child){text-align:right}
.ing-editor td{padding:7px 0;border-bottom:1px solid var(--border);font-size:12px;vertical-align:middle}
.ing-editor tr:last-child td{border-bottom:none}
.ing-editor td:not(:first-child){text-align:right}
.gram-inp{width:62px;background:var(--bg4);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-size:12px;padding:5px 7px;text-align:right;outline:none;transition:border .15s;font-family:var(--fb)}
.gram-inp:focus{border-color:var(--blue)}
.im-cell{font-size:12px;color:var(--text2);min-width:36px;display:inline-block;text-align:right}
.live-tot{background:var(--bg5);border-radius:8px;padding:10px 12px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.lt-lbl{font-family:var(--fh);font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px}
.lt-nums{display:flex;gap:12px}
.ltn2{font-size:13px;font-weight:700}
.meal-act{display:flex;gap:8px;margin-top:10px;justify-content:space-between;align-items:center}
.rst-btn{background:transparent;border:1px solid var(--border2);border-radius:6px;color:var(--text3);font-family:var(--fh);font-size:12px;font-weight:700;padding:6px 12px;cursor:pointer;transition:all .15s;text-transform:uppercase;letter-spacing:.3px}
.rst-btn:hover{border-color:var(--text2);color:var(--text)}
.log-custom{background:var(--blue);color:#fff;border:none;border-radius:6px;font-family:var(--fh);font-size:12px;font-weight:700;padding:7px 16px;cursor:pointer;transition:background .15s;text-transform:uppercase;letter-spacing:.5px}
.log-custom:hover{background:var(--blue2)}
.drag-meal{display:flex;flex-direction:row;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);cursor:grab;margin-bottom:6px;transition:all .15s;user-select:none;gap:12px}

@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

function td(){return new Date().toISOString().split('T')[0]}
function now(){let d=new Date();return`${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`}
function fd(d){return`${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`}
function sW(){return[...S.weights].sort((a,b)=>a.date.localeCompare(b.date))}
function lw(){const s=sW();return s.length?s[s.length-1].w:97.3}
function lost(){return Math.max(0,START-lw()).toFixed(1)}
function eta(){const cw=lw();if(cw<=GOAL)return'Goal reached!';const d=new Date();d.setDate(d.getDate()+Math.round((cw-GOAL)/0.5*7));return fd(d)}
function dm(){return S.meals[S.mdate]||[]}
function tot(ms){return ms.reduce((a,m)=>({kcal:a.kcal+m.kcal,pro:a.pro+m.pro,carb:a.carb+m.carb,fat:a.fat+m.fat}),{kcal:0,pro:0,carb:0,fat:0})}
function pct(v,mx){return Math.min(100,Math.round(v/mx*100))}
function bc(v,mn,mx){return v>mx?'var(--red)':v>=mn?'var(--green)':'var(--blue)'}
function am(){return[...LIB,...S.custom]}
function vt(v){if(!v)return'';const c=v==='A'?'#0066FF18;color:#0066FF':v==='B'?'#22C55E18;color:#22C55E':'#F59E0B18;color:#F59E0B';return`<span class="tag" style="background:${c}">${v}</span>`}
function tL(ws){if(!ws.length)return[];const a=0.1,o=[{date:ws[0].date,tw:ws[0].w}];for(let i=1;i<ws.length;i++)o.push({date:ws[i].date,tw:+(a*ws[i].w+(1-a)*o[i-1].tw).toFixed(2)});return o}
function wr(){const s=sW();if(s.length<2)return null;const t=tL(s);return+((t[t.length-1].tw-t[Math.max(0,t.length-8)].tw)/7*7).toFixed(2)}
function fW(){const s=sW();if(S.wtab==='week'){const d=new Date();d.setDate(d.getDate()-7);return s.filter(x=>new Date(x.date)>=d)}if(S.wtab==='month'){const d=new Date();d.setMonth(d.getMonth()-1);return s.filter(x=>new Date(x.date)>=d)}return s}

function getG(id,i){const k=id+'_'+i;return S.gO[k]!==undefined?S.gO[k]:null;}
function baseG(ing){return parseFloat(ing.qty)||100;}
function calcIng(id,ings){return ings.map((ing,i)=>{const bg=baseG(ing);const cg=getG(id,i)!==null?getG(id,i):bg;const r=cg/bg;return{name:ing.name,g:cg,kcal:Math.round(ing.kcal*r),pro:+(ing.pro*r).toFixed(1),carb:+(ing.carb*r).toFixed(1),fat:+(ing.fat*r).toFixed(1)}});}
function sumIngs(ings){return ings.reduce((a,x)=>({kcal:a.kcal+x.kcal,pro:+(a.pro+x.pro).toFixed(1),carb:+(a.carb+x.carb).toFixed(1),fat:+(a.fat+x.fat).toFixed(1)}),{kcal:0,pro:0,carb:0,fat:0});}

function updateG(id,i,val){
  S.gO[id+'_'+i]=parseFloat(val)||0;
  const det=MD[id];if(!det)return;
  const ings=calcIng(id,det.ingredients);
  ings.forEach((ing,j)=>{
    const ke=document.getElementById('imc-'+id+'-'+j+'-k');
    const pe=document.getElementById('imc-'+id+'-'+j+'-p');
    const ce=document.getElementById('imc-'+id+'-'+j+'-c');
    const fe=document.getElementById('imc-'+id+'-'+j+'-f');
    if(ke)ke.textContent=ing.kcal;
    if(pe)pe.textContent=ing.pro+'g';
    if(ce)ce.textContent=ing.carb+'g';
    if(fe)fe.textContent=ing.fat+'g';
  });
  const t=sumIngs(ings);
  const tk=document.getElementById('itot-'+id+'-k');const tp=document.getElementById('itot-'+id+'-p');
  const tc=document.getElementById('itot-'+id+'-c');const tf=document.getElementById('itot-'+id+'-f');
  if(tk)tk.textContent=t.kcal+' kcal';if(tp)tp.textContent=t.pro+'g P';
  if(tc)tc.textContent=t.carb+'g C';if(tf)tf.textContent=t.fat+'g F';
}

function resetG(id){
  const det=MD[id];if(!det)return;
  det.ingredients.forEach((ing,i)=>{
    delete S.gO[id+'_'+i];
    const el=document.getElementById('gi-'+id+'-'+i);
    if(el)el.value=baseG(ing);
    updateG(id,i,baseG(ing));
  });
}

function logCustomG(id){
  const det=MD[id];if(!det)return;
  const ings=calcIng(id,det.ingredients);
  const t=sumIngs(ings);
  const m=am().find(x=>(x.id||x.name)===id);
  if(!S.meals[S.mdate])S.meals[S.mdate]=[];
  S.meals[S.mdate].push({name:m?m.name:id,kcal:t.kcal,pro:t.pro,carb:t.carb,fat:t.fat,time:now()});
  LS.set('sc_m',S.meals);
  det.ingredients.forEach((_,i)=>delete S.gO[id+'_'+i]);
  render();
}

function doSearch(q,target){
  const lower=(q||'').toLowerCase().trim();
  const resId=target==='n'?'sr-n':'sr-l';
  const el=document.getElementById(resId);if(!el)return;
  if(lower.length<2){el.innerHTML='';return;}
  const hits=[];
  am().forEach(m=>{
    const det=MD[m.id||m.name];
    let on='';
    if(m.name.toLowerCase().includes(lower))on='Meal name match';
    if(!on&&det){const fi=det.ingredients.find(x=>x.name.toLowerCase().includes(lower));if(fi)on=fi.name;}
    if(on)hits.push({...m,on});
  });
  if(!hits.length){el.innerHTML='<div class="no-res">No meals found for "'+q+'"</div>';return;}
  el.innerHTML=hits.map(m=>`
    <div class="search-result">
      <div>
        <div class="sr-name">${m.name}${vt(m.v)}</div>
        <div class="sr-match">Contains: ${m.on}</div>
        <div class="sr-macros">${m.kcal}kcal · <span style="color:var(--protein)">${m.pro}g P</span> · ${m.carb}g C · ${m.fat}g F</div>
      </div>
      <button class="qaplus" onclick="qadd('${m.id||m.name}');document.getElementById('${resId}').innerHTML='';document.getElementById('si-${target==='n'?'n':'l'}').value=''">+</button>
    </div>`).join('');
}

function searchFoodDB(q) {
  if (!q || q.trim().length < 1) return [];
  const lower = q.toLowerCase().trim();
  return FOOD_DB.filter(f => f.name.toLowerCase().includes(lower)).slice(0, 8);
}

// ── MEAL BUILDER ─────────────────────────────────────────────────────────────
function mbCalcRow(ing) {
  const r = ing.g / 100;
  return {
    kcal: Math.round(ing.f.kcal * r),
    pro: +(ing.f.pro * r).toFixed(1),
    carb: +(ing.f.carb * r).toFixed(1),
    fat: +(ing.f.fat * r).toFixed(1),
  };
}

function mbTotals() {
  return S.mb.ings.reduce((a, ing) => {
    const v = mbCalcRow(ing);
    return { kcal: a.kcal + v.kcal, pro: +(a.pro + v.pro).toFixed(1), carb: +(a.carb + v.carb).toFixed(1), fat: +(a.fat + v.fat).toFixed(1) };
  }, { kcal: 0, pro: 0, carb: 0, fat: 0 });
}

function mbUpdateLive() {
  // Read all gram inputs
  S.mb.ings.forEach((ing, i) => {
    const el = document.getElementById('mb-g-' + i);
    if (el) {
      const v = parseFloat(el.value);
      ing.g = isNaN(v) || v < 0 ? 0 : v;
    }
  });
  // Update individual row macros
  S.mb.ings.forEach((ing, i) => {
    const v = mbCalcRow(ing);
    const setTxt = (id, val) => { const e = document.getElementById(id); if (e) e.textContent = val; };
    setTxt('mb-k-' + i, v.kcal);
    setTxt('mb-p-' + i, v.pro + 'g');
    setTxt('mb-c-' + i, v.carb + 'g');
    setTxt('mb-f-' + i, v.fat + 'g');
  });
  // Update totals
  const t = mbTotals();
  const setTxt = (id, val) => { const e = document.getElementById(id); if (e) e.textContent = val; };
  setTxt('mb-tot-k', t.kcal + ' kcal');
  setTxt('mb-tot-p', t.pro + 'g P');
  setTxt('mb-tot-c', t.carb + 'g C');
  setTxt('mb-tot-f', t.fat + 'g F');
}

function mbAddIng(food) {
  // Check for duplicate
  const exists = S.mb.ings.find(i => i.f.name === food.name);
  if (exists) {
    exists.g += 100;
  } else {
    S.mb.ings.push({ f: food, g: 100 });
  }
  S.mb.ingSearch = '';
  // Close dropdown and re-render builder
  const dd = document.getElementById('mb-dd');
  if (dd) dd.innerHTML = '';
  const si = document.getElementById('mb-si');
  if (si) si.value = '';
  mbRenderRows();
}

function mbRemoveIng(i) {
  S.mb.ings.splice(i, 1);
  mbRenderRows();
}

function mbRenderRows() {
  const container = document.getElementById('mb-ing-list');
  if (!container) return;
  if (S.mb.ings.length === 0) {
    container.innerHTML = '<div class="mb-empty">Search and add ingredients above to build your meal</div>';
    const tot = document.getElementById('mb-totals');
    if (tot) tot.style.display = 'none';
    return;
  }
  const tot = document.getElementById('mb-totals');
  if (tot) tot.style.display = '';
  const t = mbTotals();
  container.innerHTML = `
    <div class="mb-col-hdr">
      <div class="mb-col-h">Ingredient</div>
      <div class="mb-col-h">Grams</div>
      <div class="mb-col-h">Kcal</div>

    ${S.mb.ings.map((ing, i) => {

function mbSearch(q) {

function mbSave() {
  // Sync gram values from inputs before saving
  S.mb.ings.forEach((ing, i) => {
    const el = document.getElementById('mb-g-' + i);
    if (el) { const v = parseFloat(el.value); ing.g = isNaN(v) || v < 0 ? 0 : v; }
  });
  const nameEl = document.getElementById('mb-name');
  const catEl = document.getElementById('mb-cat');
  const notesEl = document.getElementById('mb-notes');
  const name = nameEl ? nameEl.value.trim() : '';
  const cat = catEl ? catEl.value : 'Breakfast';
  const notes = notesEl ? notesEl.value.trim() : '';
  // Validation
  if (!name) { alert('Please enter a meal name'); nameEl && nameEl.focus(); return; }
  if (S.mb.ings.length === 0) { alert('Add at least one ingredient'); return; }
  const zeroIngs = S.mb.ings.filter(i => i.g === 0);
  if (zeroIngs.length > 0) { if (!confirm(zeroIngs.map(i => i.f.name).join(', ') + ' has 0g — continue?')) return; }
  // Duplicate name check
  if (S.custom.find(m => m.name.toLowerCase() === name.toLowerCase())) {
    if (!confirm('A meal named "' + name + '" already exists. Overwrite?')) return;
    S.custom = S.custom.filter(m => m.name.toLowerCase() !== name.toLowerCase());
  }
  const t = mbTotals();
  const newMeal = {
    name, cat, note: notes || name,
    kcal: t.kcal, pro: t.pro, carb: t.carb, fat: t.fat,
    ingredients: S.mb.ings.map(ing => ({
      name: ing.f.name,
      qty: ing.g + 'g',
      kcal: mbCalcRow(ing).kcal,
      pro: mbCalcRow(ing).pro,
      carb: mbCalcRow(ing).carb,
      fat: mbCalcRow(ing).fat,
    }))
  };
  S.custom.push(newMeal);
  LS.set('sc_cu', S.custom);
  // Reset builder
  S.mb = { ings: [], name: '', cat: 'Breakfast', notes: '', ingSearch: '' };
  render();
}

  const aW=s.map(x=>x.w),avg=aW.length?(aW.reduce((a,b)=>a+b,0)/aW.length).toFixed(1):'--',minW=aW.length?Math.min(...aW).toFixed(1):'--',maxW=aW.length?Math.max(...aW).toFixed(1):'--',chg=s.length>=2?(s[s.length-1].w-s[0].w).toFixed(1):'--';
  const wka=[];const cp=[...s];while(cp.length){const ch=cp.splice(0,7);wka.push({lbl:ch[0].date.slice(5),avg:(ch.reduce((a,x)=>a+x.w,0)/ch.length).toFixed(1),n:ch.length})}
  return`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px"><div><div style="font-family:var(--fh);font-size:22px;font-weight:800;font-style:italic">Weight Tracker</div><div style="font-size:12px;color:var(--text3)">Log every morning · hover chart for daily weight</div></div></div>
  <div class="g4"><div class="tile tb"><div class="tlbl">Current</div><div class="tval">${cw.toFixed(1)}<span class="tunit"> kg</span></div></div><div class="tile tb"><div class="tlbl">Trend Weight</div><div class="tval cb">${tc}<span class="tunit"> kg</span></div><div class="tsub">Smoothed avg</div></div><div class="tile ${+chg<0?'tg':'tr'}"><div class="tlbl">Change</div><div class="tval ${+chg<0?'cg':'cr'}">${+chg<0?'▼ ':'▲ '}${Math.abs(+chg)}<span class="tunit"> kg</span></div><div class="tsub">since May 5</div></div><div class="tile ${rate!==null&&rate<0?'tg':'ta'}"><div class="tlbl">Weekly Rate</div><div class="tval ${rate!==null&&rate<0?'cg':'ca'}">${rate!==null?(rate<0?'▼ ':'▲ ')+Math.abs(rate).toFixed(2):'--'}<span style="font-size:11px;font-style:normal;color:var(--text3)"> kg/wk</span></div></div></div>
  <div class="card sg"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px"><div class="clbl" style="margin-bottom:0">Daily Weight — Hover for reading</div><div class="ttabs"><button class="ttab ${S.wtab==='week'?'on':''}" onclick="S.wtab='week';render()">Week</button><button class="ttab ${S.wtab==='month'?'on':''}" onclick="S.wtab='month';render()">Month</button><button class="ttab ${S.wtab==='all'?'on':''}" onclick="S.wtab='all';render()">All</button></div></div><div style="height:260px"><canvas id="ch-w"></canvas></div><div class="lgnd" style="margin-top:10px"><div class="li"><div class="ld" style="background:#0066FF"></div>Daily weight</div><div class="li"><div class="ld" style="background:#F59E0B"></div>Target -0.5kg/wk</div><div class="li"><div class="ld" style="background:#22C55E;opacity:.8"></div>88kg goal</div></div></div>
  <div class="g4"><div class="tile"><div class="tlbl">Average</div><div class="tval">${avg}<span class="tunit"> kg</span></div><div class="tsub">${s.length} entries</div></div><div class="tile tg"><div class="tlbl">Minimum</div><div class="tval cg">${minW}<span class="tunit"> kg</span></div></div><div class="tile tr"><div class="tlbl">Maximum</div><div class="tval cr">${maxW}<span class="tunit"> kg</span></div></div><div class="tile ta"><div class="tlbl">To Goal</div><div class="tval ca">${Math.max(0,cw-GOAL).toFixed(1)}<span class="tunit"> kg</span></div><div class="tsub">${eta()}</div></div></div>
  <div class="g2"><div class="card"><div class="clbl">Log Weight</div><div class="fr fr2"><div><label class="fl">Date</label><input type="date" id="wd" value="${td()}"/></div><div><label class="fl">Weight (kg)</label><input type="number" id="wv" step="0.1" placeholder="e.g. 96.8"/></div></div><button class="btn bb bfw" onclick="logW()" style="margin-bottom:14px">Log Weight</button><div style="padding:13px;background:var(--bg3);border-radius:var(--rs);font-size:12px;color:var(--text3);line-height:1.9;border:1px solid var(--border)"><div style="font-family:var(--fh);font-size:11px;font-weight:700;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.8px">Weigh-In Protocol</div>Every morning, same time | After bathroom, before eating | Same clothes or none | Trust the weekly trend not daily spikes</div>${wka.length?`<div class="divl"></div><div class="clbl">Weekly Averages</div>${wka.map(w=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)"><span style="font-size:12px;color:var(--text2)">Week of ${w.lbl}</span><div class="fx"><span style="font-size:11px;color:var(--text3)">${w.n} entries</span><span style="font-family:var(--fh);font-size:16px;font-weight:800">${w.avg} kg</span></div></div>`).join('')}`:''}</div>
  <div class="card"><div class="clbl">History — ${s.length} entries</div><div style="max-height:500px;overflow-y:auto">${s.length===0?'<div class="empty">No entries yet</div>':[...s].reverse().map((e,i,arr)=>{const prev=arr[i+1];const delta=prev?(e.w-prev.w).toFixed(1):null;const tO=tr.find(t=>t.date===e.date);return`<div class="wrow"><div><div class="wdate">${e.date.slice(5)}</div>${tO?`<div class="wtw">trend ${tO.tw.toFixed(1)}kg</div>`:''}</div><div class="fx">${delta!==null?`<span class="wd2 ${+delta<0?'dn':'up'}">${+delta<0?'▼':'▲'}${Math.abs(+delta)}</span>`:''}<span class="wval2">${e.w.toFixed(1)}kg</span><button class="delbtn" onclick="delW('${e.date}')">x</button></div></div>`}).join('')}</div></div></div>`;
}

function vLib(){
  return`
<div style="margin-bottom:16px">
  <div style="font-family:var(--fh);font-size:22px;font-weight:800;font-style:italic">Meal Library</div>
  <div style="font-size:12px;color:var(--text3)">Search ingredients · click meal to edit grams · macros update live</div>
</div>

<div class="card sg">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input id="si-l" type="text" placeholder="Search any ingredient (e.g. tofu, paneer, seitan, oats)..." oninput="doSearch(this.value,'l')"/>
  </div>
  <div id="sr-l"></div>
</div>

${CATS.map(cat=>`
  <div class="card sg"><div class="clbl">${cat}</div>
    ${am().filter(m=>m.cat===cat).map(m=>{
      const id=m.id||m.name;
      const isO=!!S.openCards[id];
      return`<div class="meal-card">
        <div class="meal-card-header" onclick="tc2('${id}')">
          <div>
            <div class="meal-card-name">${m.name}${vt(m.v)}</div>
            <div style="display:flex;gap:10px;margin-top:3px">
              <span class="mcm">${m.kcal} kcal</span>
              <span class="mcm pro">${m.pro}g P</span>
              <span class="mcm carb">${m.carb}g C</span>
              <span class="mcm fat">${m.fat}g F</span>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <button class="addmeal-btn" onclick="event.stopPropagation();qaddL('${id}')">+ Log Today</button>
            <span class="chevron" style="transform:${isO?'rotate(180deg)':'rotate(0deg)'}">▼</span>
          </div>
        </div>
        <div class="meal-card-body ${isO?'open':''}">${ingEditor(id)}</div>
      </div>`;
    }).join('')}
  </div>`).join('')}

<div class="card">
  <div class="clbl">Create Custom Meal</div>
  ${mbRenderBuilder()}
  ${S.custom.length ? `<div style="margin-top:16px">
    <div style="font-family:var(--fh);font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px">Your Custom Meals (${S.custom.length})</div>
    ${S.custom.map((m,i)=>`
      <div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)">
        <div>
          <span style="font-family:var(--fh);font-size:13px;font-weight:700;color:var(--text)">${m.name}</span>
          <span class="mb-badge">${m.cat}</span>
          <div style="font-size:11px;color:var(--text3);margin-top:2px">${m.kcal}kcal · <span style="color:var(--protein)">${m.pro}g P</span> · ${m.carb}g C · ${m.fat}g F</div>
        </div>
        <button class="delbtn" onclick="S.custom.splice(${i},1);LS.set('sc_cu',S.custom);render()">✕</button>
      </div>`).join('')}
  </div>` : ''}
</div>`;
}

function tc2(id){S.openCards[id]=!S.openCards[id];render()}
function qadd(id){const m=am().find(x=>(x.id||x.name)===id);if(!m)return;if(!S.meals[S.mdate])S.meals[S.mdate]=[];S.meals[S.mdate].push({name:m.name,kcal:m.kcal,pro:m.pro,carb:m.carb,fat:m.fat,time:now()});LS.set('sc_m',S.meals);render()}
function qaddL(id){S.mdate=td();qadd(id);go('nutrition')}
function delM(i){S.meals[S.mdate].splice(i,1);LS.set('sc_m',S.meals);render()}
function logW(){const date=document.getElementById('wd').value,w=parseFloat(document.getElementById('wv').value);if(!date||isNaN(w))return;const i=S.weights.findIndex(x=>x.date===date);if(i>=0)S.weights[i].w=w;else S.weights.push({date,w});LS.set('sc_w',S.weights);render()}
function delW(date){S.weights=S.weights.filter(x=>x.date!==date);LS.set('sc_w',S.weights);render()}
function saveL(){const name=document.getElementById('ln').value.trim();if(!name)return;S.custom.push({name,kcal:+document.getElementById('lk').value||0,pro:+document.getElementById('lp').value||0,carb:+document.getElementById('lc2').value||0,fat:+document.getElementById('lf').value||0,cat:document.getElementById('lcat').value,note:document.getElementById('lno').value.trim()});LS.set('sc_cu',S.custom);render()}
function ic(){if(S.view==='dashboard')dC();if(S.view==='weight')wC()}
function bDS(data){if(!data.length)return{labels:[],datasets:[]};const first=data[0].w,fd2=new Date(data[0].date);const tgt=data.map(x=>+(first-RATET*Math.round((new Date(x.date)-fd2)/864e5)).toFixed(2));const ptC=data.map((x,i)=>i===0?'#0066FF':x.w<data[i-1].w?'#22C55E':x.w>data[i-1].w?'#FF3B30':'#0066FF');return{labels:data.map(x=>x.date.slice(5)),datasets:[{label:'Daily weight',data:data.map(x=>x.w),borderColor:'#0066FF',borderWidth:1.8,pointRadius:3,pointHoverRadius:6,pointBackgroundColor:ptC,pointBorderColor:ptC,pointHoverBackgroundColor:ptC,tension:.25,fill:true,backgroundColor:'#0066FF0A'},{label:'Target',data:tgt,borderColor:'#F59E0B',borderWidth:1.5,borderDash:[5,4],pointRadius:0,pointHoverRadius:0,tension:.3,fill:false},{label:'Goal',data:data.map(()=>GOAL),borderColor:'#22C55E',borderWidth:1,borderDash:[3,6],pointRadius:0,pointHoverRadius:0,tension:0,fill:false}]}}
function mO(aw){return{...CG,scales:{...CG.scales,y:{...CG.scales.y,min:Math.min(GOAL-1,...aw)-0.5,max:Math.max(...aw)+0.5}}}}
function dC(){const el=document.getElementById('ch-d');if(!el)return;const s=sW();if(!s.length)return;const{labels,datasets}=bDS(s);CH['d']=new Chart(el,{type:'line',data:{labels,datasets},options:mO(s.map(x=>x.w))})}
function wC(){const el=document.getElementById('ch-w');if(!el)return;const fw=fW();if(!fw.length)return;const{labels,datasets}=bDS(fw);CH['w']=new Chart(el,{type:'line',data:{labels,datasets},options:mO(fw.map(x=>x.w))})}
boot();
</script>
</body>
</html>
