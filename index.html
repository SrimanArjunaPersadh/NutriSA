<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SRIMAN.CUTS — Nutrition & Weight Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;1,700;1,800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0D0F14;--bg2:#13161E;--bg3:#1A1E29;--bg4:#222736;--bg5:#2A3045;
  --border:#252A38;--border2:#2F3650;
  --blue:#0066FF;--blue2:#3385FF;--green:#22C55E;--red:#FF3B30;--amber:#F59E0B;
  --protein:#A78BFA;--carbs:#FCD34D;--fats:#2DD4BF;
  --text:#F1F5F9;--text2:#94A3B8;--text3:#4B5875;
  --fh:'Barlow Condensed',sans-serif;--fb:'Barlow',sans-serif;
  --r:14px;--rs:10px;

  /* FIX #3 — single source of truth for calorie targets */
  --kcal-min:2200;
  --kcal-target:2300;
  --kcal-max:2400;
}
body{background:var(--bg);color:var(--text);font-family:var(--fb);font-size:14px;min-height:100vh}
.app{max-width:960px;margin:0 auto;padding:16px 16px 40px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.logo-main{font-family:var(--fh);font-size:26px;font-weight:800;font-style:italic;letter-spacing:1px;background:linear-gradient(135deg,#0066FF,#33A1FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
.logo-sub{font-family:var(--fh);font-size:10px;font-weight:700;color:var(--text3);letter-spacing:3px;text-transform:uppercase}
.nav-pills{display:flex;gap:3px;background:var(--bg3);border-radius:12px;padding:4px;flex-wrap:wrap}
.pill{padding:7px 14px;border-radius:9px;border:none;background:transparent;color:var(--text3);cursor:pointer;font-family:var(--fh);font-size:14px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;transition:all .2s}
.pill:hover{color:var(--text2)}.pill.on{background:var(--blue);color:#fff;box-shadow:0 2px 12px #0066FF40}
.nwval{font-family:var(--fh);font-size:26px;font-weight:800;font-style:italic;text-align:right;line-height:1}
.nwlbl{font-size:11px;color:var(--text3);text-align:right}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;margin-bottom:12px}
.clbl{font-family:var(--fh);font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
@media(max-width:640px){.g2{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:13px 15px;position:relative;overflow:hidden}
.tile::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:2px 2px 0 0}
.tb::after{background:linear-gradient(90deg,#0066FF,#33A1FF)}.tg::after{background:linear-gradient(90deg,#22C55E,#16A34A)}
.ta::after{background:linear-gradient(90deg,#F59E0B,#F97316)}.tr::after{background:linear-gradient(90deg,#FF3B30,#FF6B30)}
.tlbl{font-family:var(--fh);font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.tval{font-family:var(--fh);font-size:28px;font-weight:800;font-style:italic;color:var(--text);line-height:1}
.tval.cb{color:var(--blue)}.tval.cg{color:var(--green)}.tval.cr{color:var(--red)}.tval.ca{color:var(--amber)}
.tunit{font-size:14px;font-style:normal;color:var(--text3)}.tsub{font-size:11px;color:var(--text3);margin-top:4px}
.mbar{margin-bottom:12px}.mbar:last-child{margin-bottom:0}
.mbhdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.mbname{font-family:var(--fh);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.mbnums{font-size:12px;color:var(--text3)}.mbnums b{color:var(--text);font-weight:600}
.track{height:6px;background:var(--bg5);border-radius:3px;overflow:hidden}
.fill{height:100%;border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1)}
input,select{background:var(--bg4);border:1px solid var(--border2);border-radius:var(--rs);color:var(--text);font-family:var(--fb);font-size:13px;padding:9px 12px;outline:none;transition:border .15s;width:100%}
input:focus,select:focus{border-color:var(--blue)}input::placeholder{color:var(--text3)}
.fl{font-family:var(--fh);font-size:10px;font-weight:700;color:var(--text3);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.8px}
.fr{display:grid;gap:8px;margin-bottom:10px}.fr2{grid-template-columns:1fr 1fr}
.btn{padding:9px 18px;border-radius:var(--rs);border:none;cursor:pointer;font-family:var(--fh);font-size:14px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;transition:all .15s}
.bb{background:var(--blue);color:#fff}.bb:hover{background:var(--blue2)}.bsm{padding:6px 14px;font-size:12px}.bfw{width:100%}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:10px;font-weight:700;font-family:var(--fh);margin-left:4px}
.divl{height:1px;background:var(--border);margin:13px 0}
.empty{text-align:center;padding:28px;color:var(--text3);font-size:13px;line-height:1.7}
.fx{display:flex;gap:8px;align-items:center}.sg{margin-bottom:12px}
.qarow{display:flex;justify-content:space-between;align-items:center;padding:8px 11px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);cursor:pointer;margin-bottom:4px;transition:all .15s}
.qarow:hover{border-color:var(--blue);background:var(--bg4)}
.qaname{font-family:var(--fh);font-size:13px;font-weight:800;font-style:italic}.qasub{font-size:10px;color:var(--text3);margin-top:1px}
.qaplus{width:26px;height:26px;background:var(--blue);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:700;flex-shrink:0}
.cathead{font-family:var(--fh);font-size:10px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:1px;margin:10px 0 5px 1px}
.wrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}.wrow:last-child{border-bottom:none}
.wdate{font-size:12px;color:var(--text2)}.wtw{font-family:var(--fh);font-size:10px;font-weight:700;color:var(--blue);margin-top:1px}
.wval2{font-family:var(--fh);font-size:18px;font-weight:800;font-style:italic}
.wd2{font-family:var(--fh);font-size:13px;font-weight:700}.dn{color:var(--green)}.up{color:var(--red)}
.delbtn{background:transparent;border:1px solid var(--border2);border-radius:6px;color:var(--text3);cursor:pointer;font-size:10px;padding:3px 8px;margin-left:6px;transition:all .15s}
.delbtn:hover{border-color:var(--red);color:var(--red)}
.mitem{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}.mitem:last-child{border-bottom:none}
.mname{font-weight:600;font-size:13px}.mtime{font-size:10px;color:var(--text3);margin-top:1px}
.mkcal{font-family:var(--fh);font-size:15px;font-weight:700}.mmsub{font-size:10px;color:var(--text3);text-align:right;margin-top:1px}
.ttabs{display:flex;gap:3px;background:var(--bg3);border-radius:9px;padding:3px;width:fit-content}
.ttab{padding:5px 13px;border-radius:7px;border:none;background:transparent;color:var(--text3);cursor:pointer;font-family:var(--fh);font-size:13px;font-weight:700;text-transform:uppercase;transition:all .15s}
.ttab.on{background:var(--bg5);color:var(--text);border:1px solid var(--border2)}
.lgnd{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
.li{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3)}.ld{width:12px;height:2px;border-radius:1px}
.goal-strip{background:linear-gradient(135deg,#0D1929,#0a1520);border:1px solid #0066FF22;border-radius:var(--r);padding:18px 22px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.meal-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);margin-bottom:8px;overflow:hidden;transition:border-color .15s}
.meal-card:hover{border-color:var(--border2)}
.meal-card-header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer;transition:background .15s}
.meal-card-header:hover{background:var(--bg4)}
.meal-card-name{font-family:var(--fh);font-size:16px;font-weight:800;font-style:italic}
.mcm{font-size:11px;color:var(--text3)}.mcm.pro{color:var(--protein)}.mcm.carb{color:var(--carbs)}.mcm.fat{color:var(--fats)}
.addmeal-btn{background:var(--blue);color:#fff;border:none;border-radius:6px;padding:5px 12px;font-family:var(--fh);font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap}
.addmeal-btn:hover{background:var(--blue2)}.chevron{font-size:12px;color:var(--text3);transition:transform .2s;margin-left:8px;display:inline-block}
.meal-card-body{display:none;padding:0 14px 14px;border-top:1px solid var(--border)}.meal-card-body.open{display:block}
.meal-note-strip{background:var(--bg4);border-radius:6px;padding:7px 10px;font-size:11px;color:var(--text3);margin:10px 0 8px;line-height:1.5}
/* FIX #5 — olive oil warning strip */
.oil-warning{background:#FF3B3018;border:1px solid #FF3B3044;border-radius:6px;padding:7px 10px;font-size:11px;color:var(--red);margin:10px 0 8px;line-height:1.5;font-weight:600}
.ing-table{width:100%;border-collapse:collapse;margin-top:4px}
.ing-table th{font-family:var(--fh);font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;padding:4px 0;border-bottom:1px solid var(--border);text-align:left}
.ing-table th:not(:first-child){text-align:right}
.ing-table td{padding:7px 0;border-bottom:1px solid var(--border);font-size:12px;vertical-align:middle}.ing-table tr:last-child td{border-bottom:none}
.ing-table td:not(:first-child){text-align:right;color:var(--text2)}.ing-name{font-weight:500;color:var(--text)}.ing-qty{font-size:10px;color:var(--text3);margin-top:1px}
.ing-total{background:var(--bg5);border-radius:6px;display:flex;justify-content:space-between;align-items:center;padding:8px 10px;margin-top:8px;flex-wrap:wrap;gap:8px}
.ing-total-lbl{font-family:var(--fh);font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px}
.ing-total-nums{display:flex;gap:12px}.itn{font-size:12px;font-weight:600}
.ms-badge{display:inline-flex;align-items:center;gap:5px;background:#22C55E18;border:1px solid #22C55E44;border-radius:20px;padding:3px 10px 3px 7px;font-family:var(--fh);font-size:12px;font-weight:700;color:var(--green);margin-left:10px}
.search-wrap{position:relative;margin-bottom:12px}
.search-wrap input{padding-left:34px}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;pointer-events:none}
.search-result{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);margin-bottom:5px;cursor:pointer;transition:all .15s}
.search-result:hover{border-color:var(--blue);background:var(--bg4)}
.sr-name{font-family:var(--fh);font-size:14px;font-weight:800;font-style:italic;color:var(--text)}
.sr-match{font-size:10px;color:var(--blue);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-top:1px}
.sr-macros{font-size:11px;color:var(--text3);margin-top:2px}
.no-res{text-align:center;padding:16px;color:var(--text3);font-size:12px}
.ing-editor{width:100%;border-collapse:collapse;margin-top:6px}
.ing-editor th{font-family:var(--fh);font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;padding:4px 0;border-bottom:1px solid var(--border);text-align:left}
.ing-editor th:not(:first-child){text-align:right}
.ing-editor td{padding:7px 0;border-bottom:1px solid var(--border);font-size:12px;vertical-align:middle}
.ing-editor tr:last-child td{border-bottom:none}
.ing-editor td:not(:first-child){text-align:right}
.gram-inp{width:62px;background:var(--bg4);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-size:12px;padding:5px 7px;text-align:right;outline:none;transition:border .15s;font-family:var(--fb)}
.gram-inp:focus{border-color:var(--blue)}
.im-cell{font-size:12px;color:var(--text2);min-width:36px;display:inline-block;text-align:right}
.live-tot{background:var(--bg5);border-radius:8px;padding:10px 12px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.lt-lbl{font-family:var(--fh);font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px}
.lt-nums{display:flex;gap:12px}
.ltn2{font-size:13px;font-weight:700}
.meal-act{display:flex;gap:8px;margin-top:10px;justify-content:space-between;align-items:center}
.rst-btn{background:transparent;border:1px solid var(--border2);border-radius:6px;color:var(--text3);font-family:var(--fh);font-size:12px;font-weight:700;padding:6px 12px;cursor:pointer;transition:all .15s;text-transform:uppercase;letter-spacing:.3px}
.rst-btn:hover{border-color:var(--text2);color:var(--text)}
.log-custom{background:var(--blue);color:#fff;border:none;border-radius:6px;font-family:var(--fh);font-size:12px;font-weight:700;padding:7px 16px;cursor:pointer;transition:background .15s;text-transform:uppercase;letter-spacing:.5px}
.log-custom:hover{background:var(--blue2)}
.drag-meal{display:flex;flex-direction:row;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);cursor:grab;margin-bottom:6px;transition:all .15s;user-select:none;gap:12px}
.drag-meal:hover{border-color:var(--blue);background:var(--bg4)}
.drag-meal.dragging{opacity:.35;cursor:grabbing;transform:scale(.98)}
.drag-meal-info{flex:1;min-width:0}
.drag-meal-actions{display:flex;align-items:center;flex-shrink:0}
.drag-meal .qaname{font-family:var(--fh);font-size:15px;font-weight:800;font-style:italic;color:var(--text);margin-bottom:3px}
.drag-meal .qasub{font-size:11px;color:var(--text3)}
#drop-zone{transition:border .2s,background .2s;min-height:180px}
#drop-zone.drag-over{border-color:var(--blue) !important;background:var(--bg3);box-shadow:inset 0 0 0 2px #0066ff33}
.logged-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);animation:slideIn .2s ease}
.logged-item:last-child{border-bottom:none}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
/* Water tracker */
.water-track{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.water-cup{width:32px;height:32px;border-radius:6px;border:2px solid var(--border2);background:var(--bg4);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .15s}
.water-cup.filled{background:#0066FF22;border-color:var(--blue)}
.water-cup.seitan-req{border-color:var(--amber)}
/* Meal Builder */
.mb-wrap{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px}
.mb-search-wrap{position:relative;margin-bottom:10px}
.mb-search-wrap input{padding-left:34px;font-size:13px}
.mb-results{position:absolute;top:100%;left:0;right:0;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--rs);z-index:100;max-height:220px;overflow-y:auto;margin-top:3px;box-shadow:0 8px 24px #00000060}
.mb-result{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;cursor:pointer;transition:background .12s;border-bottom:1px solid var(--border)}
.mb-result:last-child{border-bottom:none}
.mb-result:hover{background:var(--bg4)}
.mb-result-name{font-size:13px;font-weight:600;color:var(--text)}
.mb-result-cat{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-top:1px}
.mb-result-macros{font-size:11px;color:var(--text3);text-align:right}
.mb-result-macros span{color:var(--text2)}
.mb-ing-row{display:grid;grid-template-columns:1fr 100px 52px 52px 52px 52px 32px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.mb-ing-row:last-child{border-bottom:none}
.mb-ing-name{font-size:12px;font-weight:600;color:var(--text)}
.mb-ing-cat{font-size:10px;color:var(--text3)}
.mb-ing-val{font-size:12px;color:var(--text2);text-align:right}
.mb-ing-val.pro{color:var(--protein)}
.mb-ing-val.carb{color:var(--carbs)}
.mb-ing-val.fat{color:var(--fats)}
/* FIX #5 — olive oil warning in builder */
.mb-ing-val.oil-warn{color:var(--red)}
.mb-gram{width:100%;background:var(--bg4);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-size:12px;padding:5px 7px;text-align:right;outline:none;transition:border .15s;font-family:var(--fb)}
.mb-gram:focus{border-color:var(--blue)}
.mb-del{background:transparent;border:1px solid var(--border2);border-radius:5px;color:var(--text3);cursor:pointer;font-size:11px;padding:3px 7px;transition:all .15s;line-height:1}
.mb-del:hover{border-color:var(--red);color:var(--red)}
.mb-col-hdr{display:grid;grid-template-columns:1fr 100px 52px 52px 52px 52px 32px;gap:6px;padding:4px 0;border-bottom:1px solid var(--border);margin-bottom:4px}
.mb-col-h{font-family:var(--fh);font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;text-align:right}
.mb-col-h:first-child{text-align:left}
.mb-total{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--bg5);border-radius:8px;margin-top:10px;flex-wrap:wrap;gap:8px}
.mb-total-lbl{font-family:var(--fh);font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px}
.mb-total-nums{display:flex;gap:14px}
.mb-tn{font-size:13px;font-weight:700}
.mb-save-row{display:grid;grid-template-columns:1fr 180px 120px;gap:8px;margin-top:12px;align-items:end}
.mb-empty{text-align:center;padding:24px;color:var(--text3);font-size:12px}
.mb-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;font-family:var(--fh);background:var(--bg5);color:var(--text3);margin-left:4px}

/* Sync status indicator */
.sync-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;flex-shrink:0}
.sync-bar{display:flex;align-items:center;font-family:var(--fh);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);padding:4px 0}
.sync-bar.synced .sync-dot{background:var(--green);box-shadow:0 0 6px #22C55E88}
.sync-bar.syncing .sync-dot{background:var(--amber);animation:pulse 1s infinite}
.sync-bar.offline .sync-dot{background:var(--text3)}
.sync-bar.error .sync-dot{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
/* Quick Log */
.ql-wrap{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px}
.ql-search-wrap{position:relative;margin-bottom:10px}
.ql-search-wrap input{padding-left:34px}
.ql-dd{position:absolute;top:100%;left:0;right:0;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--rs);z-index:100;max-height:200px;overflow-y:auto;margin-top:3px;box-shadow:0 8px 24px #00000060}
.ql-result{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;cursor:pointer;transition:background .12s;border-bottom:1px solid var(--border)}
.ql-result:last-child{border-bottom:none}
.ql-result:hover{background:var(--bg4)}
.ql-result-name{font-size:13px;font-weight:600;color:var(--text)}
.ql-result-cat{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.ql-result-macros{font-size:11px;color:var(--text3);text-align:right}
.ql-row{display:grid;grid-template-columns:1fr 80px 52px 52px 52px 52px 28px;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)}
.ql-row:last-child{border-bottom:none}

/* Meal ingredient detail — kept as-is, but category updated to match CATS */
const MD = {

  'lc':{note:'Day C — soya chunks: lowest sodium, highest protein per calorie. Boil 10min, rinse, then cook.',ingredients:[{name:'Soya chunks',qty:'80g',kcal:280,pro:42,carb:20,fat:1},{name:'San Remo pulse pasta',qty:'60g',kcal:217,pro:13,carb:34,fat:2},{name:'Capsicum+onion+tomato',qty:'250g',kcal:63,pro:2,carb:12,fat:0},{name:'Cooking spray',qty:'3g',kcal:15,pro:0,carb:0,fat:2}]},

  'sa':{note:'Pre-Workout A — eat 90min before training. Banana for glycogen.',ingredients:[{name:'Clover Greek yoghurt',qty:'200g',kcal:106,pro:19,carb:4,fat:1},{name:'Vanilla whey',qty:'15g',kcal:60,pro:12,carb:2,fat:1},{name:'Banana (small)',qty:'80g',kcal:72,pro:1,carb:18,fat:0}]},
  'sb':{note:'Pre-Workout B — lightest on stomach. Good when lunch was heavy.',ingredients:[{name:'Clover Greek yoghurt',qty:'200g',kcal:106,pro:19,carb:4,fat:1},{name:'Mixed frozen fruit',qty:'100g',kcal:50,pro:1,carb:12,fat:0},{name:'Vanilla whey',qty:'15g',kcal:60,pro:12,carb:2,fat:1}]},
  'sc':{note:'Pre-Workout C — highest protein shake. Blend all. Drink 90min before training.',ingredients:[{name:'Clover low fat milk',qty:'300ml',kcal:141,pro:10,carb:14,fat:3},{name:'Vanilla whey',qty:'30g',kcal:120,pro:24,carb:3,fat:2},{name:'Banana (small)',qty:'80g',kcal:72,pro:1,carb:18,fat:0},{name:'Clover Greek yoghurt',qty:'100g',kcal:53,pro:10,carb:2,fat:1}]},
  'psa':{note:'Pre-Sleep A — paneer casein feeds muscle synthesis 7-8hrs. Non-negotiable every night.',ingredients:[{name:'Paneer (low fat)',qty:'100g',kcal:265,pro:18,carb:3,fat:20},{name:'Clover gouda',qty:'15g',kcal:57,pro:4,carb:0,fat:5}]},
  'psb':{note:'Pre-Sleep B — Day B was high fat (tofu). Skip gouda. Paneer only.',ingredients:[{name:'Paneer (low fat)',qty:'120g',kcal:318,pro:22,carb:4,fat:24}]},

};

/* FIX: category field updated to match renamed CATS */
const LIB = [
  {id:'ba', cat:'Breakfast',     name:'Breakfast A',    v:'A', kcal:552, pro:33, carb:81, fat:9},
  {id:'bb', cat:'Breakfast',     name:'Breakfast B',    v:'B', kcal:518, pro:40, carb:67, fat:9},

  {id:'la', cat:'Lunch',         name:'Lunch A',        v:'A', kcal:569, pro:47, carb:76, fat:7},
  {id:'lb', cat:'Lunch',         name:'Lunch B',        v:'B', kcal:710, pro:35, carb:57, fat:31},

  {id:'da', cat:'Post-Workout',  name:'Post-Workout A', v:'A', kcal:401, pro:43, carb:49, fat:4},
  {id:'db', cat:'Post-Workout',  name:'Post-Workout B', v:'B', kcal:377, pro:37, carb:39, fat:8},
  {id:'dc', cat:'Post-Workout',  name:'Post-Workout C', v:'C', kcal:346, pro:38, carb:40, fat:3},
  {id:'sa', cat:'Pre-Workout',   name:'Pre-Workout A',  v:'A', kcal:238, pro:32, carb:24, fat:2},
  {id:'sb', cat:'Pre-Workout',   name:'Pre-Workout B',  v:'B', kcal:216, pro:32, carb:18, fat:2},
  {id:'sc', cat:'Pre-Workout',   name:'Pre-Workout C',  v:'C', kcal:386, pro:45, carb:37, fat:6},
  {id:'psa',cat:'Pre-Sleep',     name:'Pre-Sleep A',    v:'A', kcal:322, pro:22, carb:3,  fat:25},
  {id:'psb',cat:'Pre-Sleep',     name:'Pre-Sleep B',    v:'B', kcal:318, pro:22, carb:4,  fat:24},
  {id:'psc',cat:'Pre-Sleep',     name:'Pre-Sleep C',    v:'C', kcal:322, pro:22, carb:3,  fat:25},
];

/* FIX #5 — foods that should trigger a warning when added */
const FLAGGED_FOODS = {
  'Olive Oil':    '⚠️ Olive oil is off-plan. Use cooking spray only.',
  'Coconut Oil':  '⚠️ Coconut oil is off-plan. Use cooking spray only.',
};

/* ─── HELPERS ─────────────────────────────────────────────────────────────── */
const LS = {
  get: k => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e) { return null; }},
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }
};

/* Debounce utility — FIX #5 debounce on gram inputs */
function debounce(fn, ms) {
  let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

let S = {
  weights:[], meals:{}, custom:[], view:'dashboard',
  mdate: td(), wtab:'all', openCards:{}, gO:{},
  sQ:'', lsQ:'',
  water:{},
  ql: { ings:[] },   // quick log staging area
  mb:{ ings:[], name:'', cat:'Breakfast', notes:'', ingSearch:'' }
};
let CH = {};

function td() { return new Date().toISOString().split('T')[0]; }
function now() { const d = new Date(); return `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`; }
function fd(d) { return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; }
function sW() { return [...S.weights].sort((a,b) => a.date.localeCompare(b.date)); }
function lw() { const s = sW(); return s.length ? s[s.length-1].w : 0; }
function startW() { const s = sW(); return s.length ? s[0].w : 0; }
function startDate() { const s = sW(); return s.length ? s[0].date.slice(5) : '--'; }
function lost() { const s = sW(); return s.length ? Math.max(0, s[0].w - lw()).toFixed(1) : '0.0'; }
function dm() { return S.meals[S.mdate] || []; }
function tot(ms) {
  const r = ms.reduce((a,m) => ({kcal:a.kcal+m.kcal, pro:a.pro+m.pro, carb:a.carb+m.carb, fat:a.fat+m.fat}), {kcal:0,pro:0,carb:0,fat:0});
  return {kcal: Math.round(r.kcal), pro: +r.pro.toFixed(1), carb: +r.carb.toFixed(1), fat: +r.fat.toFixed(1)};
}
function pct(v, mx) { return Math.min(100, Math.round(v/mx*100)); }
function bc(v, mn, mx) { return v>mx?'var(--red)': v>=mn?'var(--green)':'var(--blue)'; }
function am() { return [...LIB, ...S.custom]; }
function vt(v) {
  if (!v) return '';
  const c = v==='A'?'#0066FF18;color:#0066FF': v==='B'?'#22C55E18;color:#22C55E':'#F59E0B18;color:#F59E0B';
  return `<span class="tag" style="background:${c}">${v}</span>`;
}

/* ─── TREND WEIGHT (α=0.1, MacroFactor algorithm) ────────────────────────── */
function tL(ws) {
  if (!ws.length) return [];
  const a = 0.1;
  const o = [{date: ws[0].date, tw: ws[0].w}];
  for (let i = 1; i < ws.length; i++)
    o.push({date: ws[i].date, tw: +(a * ws[i].w + (1-a) * o[i-1].tw).toFixed(2)});
  return o;
}

/* FIX #1 — weekly rate uses actual calendar dates, not array indices.
   Finds the trend weight from exactly 7 calendar days before the latest entry. */
function wr() {
  const s = sW();
  if (s.length < 2) return null;
  const t = tL(s);
  const last = t[t.length - 1];
  const cutoffMs = new Date(last.date).getTime() - 7 * 864e5;
  // Find the trend entry closest to (and not after) 7 days ago
  const ref = t.filter(x => new Date(x.date).getTime() <= cutoffMs).pop();
  if (!ref) return null;
  const days = (new Date(last.date).getTime() - new Date(ref.date).getTime()) / 864e5;
  if (days === 0) return null;
  return +((last.tw - ref.tw) / days * 7).toFixed(2);
}

/* FIX #2 — ETA uses trend weight, not raw daily reading.
   A samoosa spike no longer moves the projected goal date. */
function eta() {
  const s = sW();
  const trendArr = tL(s);
  const tw = trendArr.length ? trendArr[trendArr.length-1].tw : lw();
  if (tw <= GOAL) return 'Goal reached!';
  const d = new Date();
  d.setDate(d.getDate() + Math.round((tw - GOAL) / 0.5 * 7));
  return fd(d);
}

/* ─── WEEK FILTER ─────────────────────────────────────────────────────────── */
function fW() {
  const s = sW();
  if (S.wtab === 'week') {
    const d = new Date(); d.setDate(d.getDate() - 7);
    return s.filter(x => new Date(x.date) >= d);
  }
  if (S.wtab === 'month') {
    const d = new Date(); d.setMonth(d.getMonth() - 1);
    return s.filter(x => new Date(x.date) >= d);
  }
  return s;
}

/* FIX #6 — weekly averages grouped by actual ISO calendar week, not array chunks */
function weeklyAverages(entries) {
  if (!entries.length) return [];
  const map = {};
  entries.forEach(e => {
    const d = new Date(e.date);
    // ISO week: Monday-based
    const day = d.getDay() || 7;
    const mon = new Date(d); mon.setDate(d.getDate() - day + 1);
    const key = mon.toISOString().split('T')[0];
    if (!map[key]) map[key] = { lbl: key.slice(5), vals: [] };
    map[key].vals.push(e.w);
  });
  return Object.values(map).map(w => ({
    lbl: w.lbl,
    avg: (w.vals.reduce((a,b) => a+b, 0) / w.vals.length).toFixed(1),
    n: w.vals.length
  }));
}

/* ─── GRAM EDITOR (Library meal cards) ───────────────────────────────────── */
function getG(id, i) { const k = id+'_'+i; return S.gO[k] !== undefined ? S.gO[k] : null; }

/* FIX #3 (partial) — baseG now only parses the leading number from qty strings like
   "133g", "75g", "3g". parseFloat correctly extracts the number from these. */
function baseG(ing) { return parseFloat(ing.qty) || 100; }

function calcIng(id, ings) {
  return ings.map((ing, i) => {
    const bg = baseG(ing);
    const cg = getG(id, i) !== null ? getG(id, i) : bg;
    const r = bg > 0 ? cg / bg : 0;
    return {
      name: ing.name, g: cg,
      kcal: Math.round(ing.kcal * r),
      pro:  +(ing.pro  * r).toFixed(1),
      carb: +(ing.carb * r).toFixed(1),
      fat:  +(ing.fat  * r).toFixed(1)
    };
  });
}

function sumIngs(ings) {
  return ings.reduce((a,x) => ({
    kcal: a.kcal + x.kcal,
    pro:  +(a.pro  + x.pro ).toFixed(1),
    carb: +(a.carb + x.carb).toFixed(1),
    fat:  +(a.fat  + x.fat ).toFixed(1)
  }), {kcal:0,pro:0,carb:0,fat:0});
}

/* Debounced DOM update — FIX #5 debounce 300ms */
const _debouncedUpdateG = debounce((id, i, val) => {
  S.gO[id+'_'+i] = parseFloat(val) || 0;
  const det = MD[id]; if (!det) return;
  const ings = calcIng(id, det.ingredients);
  ings.forEach((ing, j) => {
    const setT = (sfx, v) => { const e = document.getElementById(`imc-${id}-${j}-${sfx}`); if(e) e.textContent = v; };
    setT('k', ing.kcal); setT('p', ing.pro+'g'); setT('c', ing.carb+'g'); setT('f', ing.fat+'g');
  });
  const t = sumIngs(ings);
  const setT = (sfx, v) => { const e = document.getElementById(`itot-${id}-${sfx}`); if(e) e.textContent = v; };
  setT('k', t.kcal+' kcal'); setT('p', t.pro+'g P'); setT('c', t.carb+'g C'); setT('f', t.fat+'g F');
}, 300);

function updateG(id, i, val) { _debouncedUpdateG(id, i, val); }

/* Custom meal gram editing — uses passed ingredient array instead of MD */
const _debouncedUpdateGCustom = debounce((id, i, val, ings) => {
  S.gO[id+'_'+i] = parseFloat(val) || 0;
  const calculated = calcIng(id, ings);
  calculated.forEach((ing, j) => {
    const setT = (sfx, v) => { const e = document.getElementById(`imc-${id}-${j}-${sfx}`); if(e) e.textContent = v; };
    setT('k', ing.kcal); setT('p', ing.pro+'g'); setT('c', ing.carb+'g'); setT('f', ing.fat+'g');
  });
  const t = sumIngs(calculated);
  const setT = (sfx, v) => { const e = document.getElementById(`itot-${id}-${sfx}`); if(e) e.textContent = v; };
  setT('k', t.kcal+' kcal'); setT('p', t.pro+'g P'); setT('c', t.carb+'g C'); setT('f', t.fat+'g F');
}, 300);

function updateGCustom(id, i, val, ings) { _debouncedUpdateGCustom(id, i, val, ings); }

function resetGCustom(id, ings) {
  ings.forEach((ing, i) => {
    delete S.gO[id+'_'+i];
    const el = document.getElementById('gi-'+id+'-'+i);
    if (el) el.value = baseG(ing);
  });
  const calculated = calcIng(id, ings);
  calculated.forEach((ing, j) => {
    const setT = (sfx, v) => { const e = document.getElementById(`imc-${id}-${j}-${sfx}`); if(e) e.textContent = v; };
    setT('k', ing.kcal); setT('p', ing.pro+'g'); setT('c', ing.carb+'g'); setT('f', ing.fat+'g');
  });
  const t = sumIngs(calculated);
  const setT = (sfx, v) => { const e = document.getElementById(`itot-${id}-${sfx}`); if(e) e.textContent = v; };
  setT('k', t.kcal+' kcal'); setT('p', t.pro+'g P'); setT('c', t.carb+'g C'); setT('f', t.fat+'g F');
}

function resetG(id) {
  const det = MD[id]; if (!det) return;
  det.ingredients.forEach((ing, i) => {
    delete S.gO[id+'_'+i];
    const el = document.getElementById('gi-'+id+'-'+i);
    if (el) el.value = baseG(ing);
    // call directly (no debounce) so reset is instant
    S.gO[id+'_'+i] = baseG(ing);
    const ings = calcIng(id, det.ingredients);
    ings.forEach((g, j) => {
      const setT = (sfx, v) => { const e = document.getElementById(`imc-${id}-${j}-${sfx}`); if(e) e.textContent = v; };
      setT('k', g.kcal); setT('p', g.pro+'g'); setT('c', g.carb+'g'); setT('f', g.fat+'g');
    });
    const t = sumIngs(ings);
    const setT = (sfx, v) => { const e = document.getElementById(`itot-${id}-${sfx}`); if(e) e.textContent = v; };
    setT('k', t.kcal+' kcal'); setT('p', t.pro+'g P'); setT('c', t.carb+'g C'); setT('f', t.fat+'g F');
    delete S.gO[id+'_'+i];
  });
}

function logCustomG(id) {
  const det = MD[id];
  const custom = !det ? S.custom.find(m => (m.id||m.name) === id) : null;
  const baseIngs = det ? det.ingredients
    : custom ? custom.ingredients.map(ing => ({...ing, qty: String(parseFloat(ing.qty)||100)}))
    : null;
  if (!baseIngs) return;
  const ings = calcIng(id, baseIngs);
  const t = sumIngs(ings);
  const m = am().find(x => (x.id||x.name) === id);
  if (!S.meals[S.mdate]) S.meals[S.mdate] = [];
  S.meals[S.mdate].push({name: m ? m.name : id, kcal: t.kcal, pro: t.pro, carb: t.carb, fat: t.fat, time: now(), _libId: id});
  LS.set('sc_m', S.meals);
  baseIngs.forEach((_,i) => delete S.gO[id+'_'+i]);
  render();
}

/* ─── SEARCH ──────────────────────────────────────────────────────────────── */
function doSearch(q, target) {
  const lower = (q||'').toLowerCase().trim();
  const resId = target==='n' ? 'sr-n' : 'sr-l';
  const el = document.getElementById(resId); if (!el) return;
  if (lower.length < 2) { el.innerHTML = ''; return; }
  const hits = [];
  am().forEach(m => {
    const det = MD[m.id||m.name];
    let on = '';
    if (m.name.toLowerCase().includes(lower)) on = 'Meal name match';
    if (!on && det) {
      const fi = det.ingredients.find(x => x.name.toLowerCase().includes(lower));
      if (fi) on = fi.name;
    }
    if (!on && m.ingredients && m.ingredients.length) {
      const fi = m.ingredients.find(x => x.name.toLowerCase().includes(lower));
      if (fi) on = fi.name;
    }
    if (on) hits.push({...m, on});
  });
  if (!hits.length) { el.innerHTML = `<div class="no-res">No meals found for "${q}"</div>`; return; }
  el.innerHTML = hits.map(m => `
    <div class="search-result">
      <div>
        <div class="sr-name">${m.name}${vt(m.v)}</div>
        <div class="sr-match">Contains: ${m.on}</div>
        <div class="sr-macros">${m.kcal}kcal · <span style="color:var(--protein)">${m.pro}g P</span> · ${m.carb}g C · ${m.fat}g F</div>
      </div>
      <button class="qaplus" onclick="qadd('${m.id||m.name}');document.getElementById('${resId}').innerHTML='';document.getElementById('si-${target==='n'?'n':'l'}').value=''">+</button>
    </div>`).join('');
}

function dragStart(e, id) {
  S._dragId = id;
  e.dataTransfer.effectAllowed = 'copy';
  e.dataTransfer.setData('text/plain', id);
  setTimeout(() => { const el = document.querySelector('[data-id="'+id+'"]'); if(el) el.classList.add('dragging'); }, 0);
}
function dragEnd() { document.querySelectorAll('.drag-meal').forEach(el => el.classList.remove('dragging')); S._dragId = null; }
function dragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect='copy'; const z=document.getElementById('drop-zone'); if(z) z.classList.add('drag-over'); }
function dragLeave(e) { const z=document.getElementById('drop-zone'); if(z&&!z.contains(e.relatedTarget)) z.classList.remove('drag-over'); }
function dropMeal(e) {
  e.preventDefault();
  const z = document.getElementById('drop-zone'); if(z) z.classList.remove('drag-over');
  const id = e.dataTransfer.getData('text/plain') || S._dragId; if(!id) return;
  const m = am().find(x => (x.id||x.name) === id); if(!m) return;
  if (!S.meals[S.mdate]) S.meals[S.mdate] = [];
  S.meals[S.mdate].push({name:m.name, kcal:m.kcal, pro:m.pro, carb:m.carb, fat:m.fat, time:now()});
  LS.set('sc_m', S.meals);
  render();
}

/* ─── FOOD DB HELPERS ─────────────────────────────────────────────────────── */
function foodMacros(food, qty) {
  const r = qty / 100;
  return {
    kcal: Math.round((food.per100||food.perUnit).kcal * r),
    pro:  +((food.per100||food.perUnit).pro  * r).toFixed(1),
    carb: +((food.per100||food.perUnit).carb * r).toFixed(1),
    fat:  +((food.per100||food.perUnit).fat  * r).toFixed(1),
  };
}
function unitLabel(food) { return food.unit; }
function unitStep(food) { return food.unit === 'ml' ? 10 : 5; }
function unitMin() { return 0; }
function searchFoodDB(q) {
  if (!q || q.trim().length < 1) return [];
  const lower = q.toLowerCase().trim();
  return FOOD_DB.filter(f => f.name.toLowerCase().includes(lower)).slice(0, 8);
}

/* ─── MEAL BUILDER ────────────────────────────────────────────────────────── */
function mbCalcRow(ing) { return foodMacros(ing.f, ing.qty); }
function mbTotals() {
  return S.mb.ings.reduce((a, ing) => {
    const v = mbCalcRow(ing);
    return {kcal:a.kcal+v.kcal, pro:+(a.pro+v.pro).toFixed(1), carb:+(a.carb+v.carb).toFixed(1), fat:+(a.fat+v.fat).toFixed(1)};
  }, {kcal:0,pro:0,carb:0,fat:0});
}

/* Debounced live update for meal builder inputs — FIX #5 */
const _debouncedMbUpdate = debounce(() => {
  S.mb.ings.forEach((ing, i) => {
    const el = document.getElementById('mb-g-' + i);
    if (el) { const v = parseFloat(el.value); ing.qty = isNaN(v)||v<0 ? 0 : v; }
  });
  S.mb.ings.forEach((ing, i) => {
    const v = mbCalcRow(ing);
    const setTxt = (id, val) => { const e = document.getElementById(id); if(e) e.textContent = val; };
    setTxt('mb-k-'+i, v.kcal); setTxt('mb-p-'+i, v.pro+'g'); setTxt('mb-c-'+i, v.carb+'g'); setTxt('mb-f-'+i, v.fat+'g');

  const notes= notesEl? notesEl.value.trim() : '';
  if (!name) { alert('Please enter a meal name'); nameEl&&nameEl.focus(); return; }
  if (S.mb.ings.length===0) { alert('Add at least one ingredient'); return; }
  const zeroIngs = S.mb.ings.filter(i=>i.qty===0);
  if (zeroIngs.length>0 && !confirm(zeroIngs.map(i=>i.f.name).join(', ')+' has 0g — continue?')) return;

    S.custom = S.custom.filter(m=>m.name.toLowerCase()!==name.toLowerCase());
  }
  const t = mbTotals();
  const newMeal = {
    name, cat, note: notes||name,
    kcal:t.kcal, pro:t.pro, carb:t.carb, fat:t.fat,
    ingredients: S.mb.ings.map(ing => {
      const v = mbCalcRow(ing);
      return {name:ing.f.name, qty:ing.qty+'g', kcal:v.kcal, pro:v.pro, carb:v.carb, fat:v.fat};

  if (cloudId) {

    LS.set('sc_cu', S.custom);
  }
}

/* Pull all data from Supabase and merge into S, then render */
async function syncFromCloud() {
  if (!sb) { syncStatus('offline', 'Local only'); render(); return; }
  syncStatus('syncing', 'Syncing...');
  try {
    const [wRes, mRes, cRes, waRes] = await Promise.all([
      sb.from('weight_logs').select('*').order('date', {ascending:true}),
      sb.from('meal_logs').select('*').order('date').order('sort_order'),
      sb.from('custom_meals').select('*').order('created_at'),
      sb.from('water_logs').select('*'),
    ]);

    if (wRes.error)  { console.error('weight_logs error:', wRes.error); throw wRes.error; }
    if (mRes.error)  { console.error('meal_logs error:', mRes.error); throw mRes.error; }
    if (cRes.error)  { console.error('custom_meals error:', cRes.error); throw cRes.error; }
    if (waRes.error) { console.error('water_logs error:', waRes.error); throw waRes.error; }

    /* Weight logs → array of {date, w} */
    if (wRes.data.length > 0) {
      /* Strip time component — Supabase returns 'YYYY-MM-DDT00:00:00' for date columns */
      S.weights = wRes.data.map(r => ({date: r.date.slice(0,10), w: parseFloat(r.weight)}));
      LS.set('sc_w', S.weights);
    } else {
      /* No weights in Supabase yet — will populate when user logs first weight */
    }

    /* Meal logs → { 'YYYY-MM-DD': [{...}] } */
    if (mRes.data.length > 0) {
      const cloudMeals = {};
      mRes.data.forEach(r => {
        const date = r.date.slice(0,10);
        if (!cloudMeals[date]) cloudMeals[date] = [];
        cloudMeals[date].push({
          _id:    r.id,
          _libId: r.lib_id || null,
          name:   r.name,
          kcal:   Math.round(r.kcal),
          pro:    +parseFloat(r.pro).toFixed(1),
          carb:   +parseFloat(r.carb).toFixed(1),
          fat:    +parseFloat(r.fat).toFixed(1),
          time:   r.logged_time || '',
        });
      });
      /* Merge strategy: for each date, use whichever source has MORE entries.
         This prevents a delayed cloud sync from wiping locally-logged meals
         that haven't finished saving to Supabase yet. */
      const localMeals = S.meals || {};
      const allDates = new Set([...Object.keys(cloudMeals), ...Object.keys(localMeals)]);
      const merged = {};
      allDates.forEach(date => {
        const cloud = cloudMeals[date] || [];
        const local = localMeals[date] || [];
        /* Use cloud if it has entries — it's the source of truth.
           Fall back to local only if cloud has nothing for that date. */
        merged[date] = cloud.length >= local.length ? cloud : local;
      });
      S.meals = merged;
      LS.set('sc_m', S.meals);
    }

    /* Custom meals */
    if (cRes.data.length > 0) {
      S.custom = cRes.data.map(r => ({
        _id:         r.id,
        name:        r.name,
        cat:         r.cat,
        note:        r.note || '',
        kcal:        Math.round(r.kcal),
        pro:         +parseFloat(r.pro).toFixed(1),
        carb:        +parseFloat(r.carb).toFixed(1),
        fat:         +parseFloat(r.fat).toFixed(1),
        ingredients: r.ingredients || [],
      }));
      LS.set('sc_cu', S.custom);
    }

    /* Water logs */
    if (waRes.data.length > 0) {
      const water = {};
      waRes.data.forEach(r => { water[r.date.slice(0,10)] = r.cups; });
      S.water = water;
      LS.set('sc_wa', S.water);
    }

    syncStatus('synced', 'Synced');
    render();
  } catch(e) {
    const msg = e?.message || e?.details || e?.hint || JSON.stringify(e) || 'Unknown error';
    console.error('Sync error details:', msg, e);
    syncStatus('error', 'Sync failed — using local data');
    render();
  }
}

/* ── Weight actions ── */
async function cloudLogW(date, w) {
  if (!sb) return false;
  syncStatus('syncing', 'Saving...');
  const {error} = await sb.from('weight_logs').upsert({date, weight: w}, {onConflict:'date'});
  if (error) { syncStatus('error', 'Save failed'); return false; }
  syncStatus('synced', 'Saved');
  return true;
}

async function cloudDelW(date) {
  if (!sb) return false;
  syncStatus('syncing', 'Deleting...');
  const {error} = await sb.from('weight_logs').delete().eq('date', date);
  if (error) { syncStatus('error', 'Delete failed'); return false; }
  syncStatus('synced', 'Synced');
  return true;
}

/* ── Meal actions ── */
async function cloudAddMeal(date, meal) {
  if (!sb) return null;
  syncStatus('syncing', 'Saving...');
  const sortOrder = (S.meals[date]||[]).length;
  const {data, error} = await sb.from('meal_logs').insert({
    date, name:meal.name, kcal:meal.kcal,
    pro:meal.pro, carb:meal.carb, fat:meal.fat,
    logged_time: meal.time, sort_order: sortOrder,
    lib_id: meal._libId || null,
  }).select().single();
  if (error) { syncStatus('error', 'Save failed'); return null; }
  syncStatus('synced', 'Saved');
  return data.id;
}

async function cloudDelMeal(mealId) {
  if (!sb || !mealId) return true;
  syncStatus('syncing', 'Deleting...');
  const {error} = await sb.from('meal_logs').delete().eq('id', mealId);
  if (error) { syncStatus('error', 'Delete failed'); return false; }
  syncStatus('synced', 'Synced');
  return true;
}

  const customName = nameEl ? nameEl.value.trim() : '';
  const autoName = S.ql.ings.length === 1
    ? `${S.ql.ings[0].f.name} (${S.ql.ings[0].qty}${S.ql.ings[0].f.unit})`
    : S.ql.ings.map(i => `${i.f.name.split(' ')[0]} ${i.qty}${i.f.unit}`).join(', ');
  const name = customName || autoName;
  const meal = {
    name, kcal: t.kcal, pro: t.pro, carb: t.carb, fat: t.fat, time: now(),
    /* Store ingredients so the logged entry dropdown can show/edit them */
    _ings: S.ql.ings.map(i => ({
      name: i.f.name,
      qty:  String(i.qty),
      kcal: qlCalcRow(i).kcal,
      pro:  qlCalcRow(i).pro,
      carb: qlCalcRow(i).carb,
      fat:  qlCalcRow(i).fat,
    }))
  };
  if (!S.meals[S.mdate]) S.meals[S.mdate] = [];
  S.meals[S.mdate].push(meal);
  LS.set('sc_m', S.meals);
  S.ql.ings = [];
  render();
  const cloudId = await cloudAddMeal(S.mdate, meal);
  if (cloudId) {
    const idx = S.meals[S.mdate].length - 1;
    if (S.meals[S.mdate][idx]) S.meals[S.mdate][idx]._id = cloudId;
    LS.set('sc_m', S.meals);
  }
}

/* ─── BOOT & ROUTING ──────────────────────────────────────────────────────── */
function boot() {
  document.addEventListener('click', e => {
    if (!e.target.closest('.mb-search-wrap')) { const dd=document.getElementById('mb-dd'); if(dd) dd.innerHTML=''; }
    if (!e.target.closest('.ql-search-wrap')) { const dd=document.getElementById('ql-dd'); if(dd) dd.innerHTML=''; }
  });
  /* Load from localStorage immediately — app is usable before cloud responds */
  S.weights = LS.get('sc_w') || [];
  S.meals   = LS.get('sc_m') || {};
  S.custom  = LS.get('sc_cu') || [];
  S.water   = LS.get('sc_wa') || {};
  render();
  /* Sync from Supabase after render — don't block UI */
  if (sb) {
    setTimeout(syncFromCloud, 100);
  } else {
    syncStatus('offline', 'Local only');
  }
}

function go(v) {
  S.view = v;
  document.querySelectorAll('.pill').forEach(p => p.classList.toggle('on', p.textContent.toLowerCase().startsWith(v.slice(0,3))));
  render();
}

function render() {
  kc();
  const vc = document.getElementById('vc');
  if (S.view==='dashboard') vc.innerHTML = vD();
  else if (S.view==='nutrition') vc.innerHTML = vN();
  else if (S.view==='weight')    vc.innerHTML = vW();
  else if (S.view==='library')   vc.innerHTML = vLib();
  document.getElementById('nw').textContent = lw().toFixed(1);
  setTimeout(ic, 80);
}

    <div class="clbl" style="margin-bottom:0">Daily Weight — Hover for reading</div>
    <div class="ttabs">
      <button class="ttab ${S.wtab==='week'?'on':''}"  onclick="S.wtab='week';render()">Week</button>
      <button class="ttab ${S.wtab==='month'?'on':''}" onclick="S.wtab='month';render()">Month</button>
      <button class="ttab ${S.wtab==='all'?'on':''}"   onclick="S.wtab='all';render()">All</button>
    </div>
  </div>
  <div style="height:260px"><canvas id="ch-w"></canvas></div>
  <div class="lgnd" style="margin-top:10px">
    <div class="li"><div class="ld" style="background:#0066FF"></div>Daily weight</div>
    <div class="li"><div class="ld" style="background:#F59E0B"></div>Target −0.5kg/wk</div>
    <div class="li"><div class="ld" style="background:#22C55E;opacity:.8"></div>88kg goal</div>
  </div>
</div>
<div class="g4">
  <div class="tile"><div class="tlbl">Average</div><div class="tval">${avg}<span class="tunit"> kg</span></div><div class="tsub">${s.length} entries</div></div>
  <div class="tile tg"><div class="tlbl">Minimum</div><div class="tval cg">${minW}<span class="tunit"> kg</span></div></div>
  <div class="tile tr"><div class="tlbl">Maximum</div><div class="tval cr">${maxW}<span class="tunit"> kg</span></div></div>
  <div class="tile ta"><div class="tlbl">To Goal</div><div class="tval ca">${Math.max(0,cw-GOAL).toFixed(1)}<span class="tunit"> kg</span></div><div class="tsub">${eta()}</div></div>
</div>
<div class="g2">
  <div class="card">
    <div class="clbl">Log Weight</div>
    <div class="fr fr2">
      <div><label class="fl">Date</label><input type="date" id="wd" value="${td()}"/></div>
      <div><label class="fl">Weight (kg)</label><input type="number" id="wv" step="0.1" placeholder="e.g. 96.8"/></div>
    </div>
    <button class="btn bb bfw" onclick="logW()" style="margin-bottom:14px">Log Weight</button>
    <div style="padding:13px;background:var(--bg3);border-radius:var(--rs);font-size:12px;color:var(--text3);line-height:1.9;border:1px solid var(--border)">
      <div style="font-family:var(--fh);font-size:11px;font-weight:700;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.8px">Weigh-In Protocol</div>
      Every morning, same time · After bathroom, before eating · Same clothes or none · Trust the trend, not single spikes
    </div>
    ${wka.length ? `
    <div class="divl"></div>
    <div class="clbl">Weekly Averages</div>
    ${wka.map(w=>`
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:12px;color:var(--text2)">Week of ${w.lbl}</span>
        <div class="fx">
          <span style="font-size:11px;color:var(--text3)">${w.n} entries</span>
          <span style="font-family:var(--fh);font-size:16px;font-weight:800">${w.avg} kg</span>
        </div>
      </div>`).join('')}` : ''}
  </div>
  <div class="card">
    <div class="clbl">History — ${s.length} entries</div>
    <div style="max-height:500px;overflow-y:auto">
      ${s.length===0 ? '<div class="empty">No entries yet</div>'
        : [...s].reverse().map((e,i,arr) => {
            const prev = arr[i+1];
            const delta = prev ? (e.w - prev.w).toFixed(1) : null;
            const tO = trendArr.find(t => t.date===e.date);
            return `<div class="wrow">
              <div>
                <div class="wdate">${e.date.slice(5)}</div>
                ${tO?`<div class="wtw">trend ${tO.tw.toFixed(1)}kg</div>`:''}
              </div>
              <div class="fx">
                ${delta!==null?`<span class="wd2 ${+delta<0?'dn':'up'}">${+delta<0?'▼':'▲'}${Math.abs(+delta)}</span>`:''}
                <span class="wval2">${e.w.toFixed(1)}kg</span>
                <button class="delbtn" onclick="delW('${e.date}')">x</button>
              </div>
            </div>`;
          }).join('')}
    </div>
  </div>
</div>`;
}

/* ─── LIBRARY VIEW ────────────────────────────────────────────────────────── */
function vLib() {
  return `
<div style="margin-bottom:16px">
  <div style="font-family:var(--fh);font-size:22px;font-weight:800;font-style:italic">Meal Library</div>
  <div style="font-size:12px;color:var(--text3)">Build custom meals · search ingredients · edit grams · macros update live</div>
</div>

<div class="card sg">
  <div class="clbl">Create Custom Meal</div>
  ${mbRenderBuilder()}
  ${S.custom.length ? `
  <div style="margin-top:16px">
    <div style="font-family:var(--fh);font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px">Your Custom Meals (${S.custom.length})</div>
    ${S.custom.map((m,i) => `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)">
        <div>
          <span style="font-family:var(--fh);font-size:13px;font-weight:700;color:var(--text)">${m.name}</span>
          <span class="mb-badge">${m.cat}</span>
          <div style="font-size:11px;color:var(--text3);margin-top:2px">${m.kcal}kcal · <span style="color:var(--protein)">${m.pro}g P</span> · ${m.carb}g C · ${m.fat}g F</div>
        </div>
        <button class="delbtn" onclick="(async()=>{const m=S.custom[${i}];S.custom.splice(${i},1);LS.set('sc_cu',S.custom);render();await cloudDelCustomMeal(m&&m._id)})()">✕</button>
      </div>`).join('')}
  </div>` : ''}
</div>

<div class="card sg">
  <div class="clbl">Search Meals &amp; Ingredients</div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input id="si-l" type="text" placeholder="Search any ingredient or meal name (e.g. tofu, paneer, seitan, oats)..." oninput="doSearch(this.value,'l')"/>
  </div>
  <div id="sr-l"></div>
</div>

${CATS.map(cat=>`
  <div class="card sg">
    <div class="clbl">${cat}</div>
    ${am().filter(m=>m.cat===cat).map(m => {
      const id = m.id||m.name;
      const isO = !!S.openCards[id];
      return `<div class="meal-card">
        <div class="meal-card-header" onclick="tc2('${id}')">
          <div>
            <div class="meal-card-name">${m.name}${vt(m.v)}</div>
            <div style="display:flex;gap:10px;margin-top:3px">
              <span class="mcm">${m.kcal} kcal</span>
              <span class="mcm pro">${m.pro}g P</span>
              <span class="mcm carb">${m.carb}g C</span>
              <span class="mcm fat">${m.fat}g F</span>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <button class="addmeal-btn" onclick="event.stopPropagation();qaddL('${id}')">+ Log Today</button>
            <span class="chevron" style="transform:${isO?'rotate(180deg)':'rotate(0deg)'}">▼</span>
          </div>
        </div>
        <div class="meal-card-body ${isO?'open':''}">${ingEditor(id)}</div>
      </div>`;
    }).join('')}
  </div>`).join('')}`;
}

/* ─── ACTIONS ─────────────────────────────────────────────────────────────── */
function tc2(id) { S.openCards[id] = !S.openCards[id]; render(); }

function toggleNCard(id) {
  S.openCards['n_'+id] = !S.openCards['n_'+id];
  const isO = S.openCards['n_'+id];
  const card = document.querySelector('[data-id="' + id + '"]');
  if (!card) { render(); return; }
  const body = card.querySelector('.meal-card-body');
  const chevron = card.querySelector('.chevron');
  if (body) {
    body.innerHTML = isO ? ingEditor(id) : '';
    body.classList.toggle('open', isO);
  }
  if (chevron) chevron.style.transform = isO ? 'rotate(180deg)' : 'rotate(0deg)';
}

function toggleLogCard(i) {
  S.openCards['log_'+i] = !S.openCards['log_'+i];
  const isO = S.openCards['log_'+i];
  const m = (S.meals[S.mdate]||[])[i];
  const container = document.getElementById('log-entry-'+i);
  if (!container || !m) { render(); return; }
  const body = container.querySelector('.log-entry-body');
  const chevron = container.querySelector('.log-chevron');
  if (body) body.innerHTML = isO ? loggedItemEditor(m, i) : '';
  if (chevron) chevron.style.transform = isO ? 'rotate(180deg)' : 'rotate(0deg)';
}

function loggedItemEditor(m, idx) {
  /* 1. Try _libId → MD (plan meals) */
  const libId = m._libId;
  const det = libId ? MD[libId] : null;
  if (det) return loggedItemEditorWithIngs(m, idx, det.ingredients, det.note);

  /* 2. Try _libId → custom meals */
  let custom = libId ? S.custom.find(c => (c.id||c.name) === libId) : null;
  if (!custom) custom = S.custom.find(c => c.name === m.name);
  if (custom && custom.ingredients && custom.ingredients.length) {
    const baseIngs = custom.ingredients.map(i => ({...i, qty: String(parseFloat(i.qty)||100)}));
    return loggedItemEditorWithIngs(m, idx, baseIngs, custom.note);
  }

  /* 3. Quick log entries — ingredients stored directly on the meal */
  if (m._ings && m._ings.length) {
    return loggedItemEditorWithIngs(m, idx, m._ings);
  }

  /* 4. Name fallback for old plan meal entries logged before _libId existed */
  const mdKey = Object.keys(MD).find(k => {
    const l = LIB.find(x => x.id === k);
    return l && l.name === m.name;
  });
  if (mdKey) return loggedItemEditorWithIngs(m, idx, MD[mdKey].ingredients, MD[mdKey].note);

  /* 5. No ingredient data at all — raw macro editor */
  return loggedItemMacroEditor(m, idx);
}

function loggedItemEditorWithIngs(m, idx, baseIngs, note) {
  const edId = 'logged_'+idx;
  const ings = calcIng(edId, baseIngs);
  const t = sumIngs(ings);
  return `<div style="background:var(--bg4);border-radius:var(--rs);padding:12px;margin-bottom:10px">
    ${note ? `<div class="meal-note-strip" style="margin-top:0;margin-bottom:8px">${note}</div>` : ''}
    <table class="ing-editor" style="margin-top:0">
      <thead><tr><th>Ingredient</th><th>g</th><th>Kcal</th><th style="color:var(--protein)">P</th><th style="color:var(--carbs)">C</th><th style="color:var(--fats)">F</th></tr></thead>
      <tbody>${baseIngs.map((ing,i) => `<tr>
        <td><div class="ing-name" style="font-size:11px">${ing.name}</div></td>
        <td><input class="gram-inp" id="gi-${edId}-${i}" type="number" min="0" step="5" value="${ings[i].g}" oninput="updateGCustom('${edId}',${i},this.value,${JSON.stringify(baseIngs).replace(/"/g,'&quot;')})"/></td>
        <td><span class="im-cell" id="imc-${edId}-${i}-k">${ings[i].kcal}</span></td>
        <td><span class="im-cell" style="color:var(--protein)" id="imc-${edId}-${i}-p">${ings[i].pro}g</span></td>
        <td><span class="im-cell" style="color:var(--carbs)" id="imc-${edId}-${i}-c">${ings[i].carb}g</span></td>
        <td><span class="im-cell" style="color:var(--fats)" id="imc-${edId}-${i}-f">${ings[i].fat}g</span></td>
      </tr>`).join('')}</tbody>
    </table>
    <div class="live-tot" style="margin-top:8px">
      <span class="lt-lbl">New total</span>
      <div class="lt-nums">
        <span class="ltn2" id="itot-${edId}-k">${t.kcal} kcal</span>
        <span class="ltn2" style="color:var(--protein)" id="itot-${edId}-p">${t.pro}g P</span>
        <span class="ltn2" style="color:var(--carbs)" id="itot-${edId}-c">${t.carb}g C</span>
        <span class="ltn2" style="color:var(--fats)" id="itot-${edId}-f">${t.fat}g F</span>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:10px;justify-content:space-between">
      <button class="rst-btn" onclick="resetGCustom('${edId}',${JSON.stringify(baseIngs).replace(/"/g,'&quot;')})">↺ Reset</button>
      <button class="log-custom" onclick="updateLoggedEntry(${idx},'${edId}',${JSON.stringify(baseIngs).replace(/"/g,'&quot;')})">✓ Update Log</button>
    </div>
  </div>`;
}

function loggedItemMacroEditor(m, idx) {
  return `<div style="background:var(--bg4);border-radius:var(--rs);padding:12px;margin-bottom:10px">
    <div style="font-size:11px;color:var(--text3);margin-bottom:10px">No ingredient breakdown available — edit totals directly:</div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px">
      <div><label class="fl">Kcal</label><input type="number" id="le-k-${idx}" value="${m.kcal}" style="font-size:12px;padding:6px 8px"/></div>
      <div><label class="fl">Protein g</label><input type="number" id="le-p-${idx}" value="${m.pro}" step="0.1" style="font-size:12px;padding:6px 8px"/></div>
      <div><label class="fl">Carbs g</label><input type="number" id="le-c-${idx}" value="${m.carb}" step="0.1" style="font-size:12px;padding:6px 8px"/></div>
      <div><label class="fl">Fat g</label><input type="number" id="le-f-${idx}" value="${m.fat}" step="0.1" style="font-size:12px;padding:6px 8px"/></div>
    </div>
    <button class="log-custom" style="width:100%" onclick="updateLoggedMacros(${idx})">✓ Update Entry</button>
  </div>`;
}

async function updateLoggedEntry(idx, edId, baseIngs) {
  /* Read current gram values from inputs */
  baseIngs.forEach((ing, i) => {
    const el = document.getElementById('gi-'+edId+'-'+i);
    if (el) S.gO[edId+'_'+i] = parseFloat(el.value) || 0;
  });
  const ings = calcIng(edId, baseIngs);
  const t = sumIngs(ings);
  const meal = S.meals[S.mdate][idx];
  if (!meal) return;
  const cloudId = meal._id;
  meal.kcal = t.kcal; meal.pro = t.pro; meal.carb = t.carb; meal.fat = t.fat;
  LS.set('sc_m', S.meals);
  baseIngs.forEach((_,i) => delete S.gO[edId+'_'+i]);
  S.openCards['log_'+idx] = false;
  render();
  /* Update in Supabase */
  if (sb && cloudId) {
    syncStatus('syncing', 'Saving...');
    const {error} = await sb.from('meal_logs').update({
      kcal: t.kcal, pro: t.pro, carb: t.carb, fat: t.fat
    }).eq('id', cloudId);
    syncStatus(error ? 'error' : 'synced', error ? 'Save failed' : 'Saved');
  }
}

async function updateLoggedMacros(idx) {
  const k = parseFloat(document.getElementById('le-k-'+idx)?.value)||0;
  const p = parseFloat(document.getElementById('le-p-'+idx)?.value)||0;
  const c = parseFloat(document.getElementById('le-c-'+idx)?.value)||0;
  const f = parseFloat(document.getElementById('le-f-'+idx)?.value)||0;
  const meal = S.meals[S.mdate][idx]; if (!meal) return;
  const cloudId = meal._id;
  meal.kcal=Math.round(k); meal.pro=+p.toFixed(1); meal.carb=+c.toFixed(1); meal.fat=+f.toFixed(1);
  LS.set('sc_m', S.meals);
  S.openCards['log_'+idx] = false;
  render();
  if (sb && cloudId) {
    syncStatus('syncing', 'Saving...');
    const {error} = await sb.from('meal_logs').update({
      kcal: meal.kcal, pro: meal.pro, carb: meal.carb, fat: meal.fat
    }).eq('id', cloudId);
    syncStatus(error ? 'error' : 'synced', error ? 'Save failed' : 'Saved');
  }
}

async function qadd(id) {
  const m = am().find(x=>(x.id||x.name)===id); if(!m) return;
  if (!S.meals[S.mdate]) S.meals[S.mdate] = [];
  const meal = {name:m.name, kcal:m.kcal, pro:m.pro, carb:m.carb, fat:m.fat, time:now(), _libId:id};
  const mealIdx = S.meals[S.mdate].length; // capture index BEFORE push
  S.meals[S.mdate].push(meal);
  LS.set('sc_m', S.meals);
  render();
  const cloudId = await cloudAddMeal(S.mdate, meal);
  if (cloudId && S.meals[S.mdate][mealIdx]) {
    S.meals[S.mdate][mealIdx]._id = cloudId;
    LS.set('sc_m', S.meals);
  }
}

function qaddL(id) { S.mdate = td(); qadd(id); go('nutrition'); }

async function delM(i) {
  const meal = (S.meals[S.mdate]||[])[i];
  if (!meal) return;
  const cloudId = meal._id || null;
  S.meals[S.mdate].splice(i, 1);
  LS.set('sc_m', S.meals);
  render();
  await cloudDelMeal(cloudId);
}

async function logW() {
  const date=document.getElementById('wd').value, w=parseFloat(document.getElementById('wv').value);
  if (!date||isNaN(w)) return;
  const i = S.weights.findIndex(x=>x.date===date);
  if (i>=0) S.weights[i].w = w; else S.weights.push({date,w});
  LS.set('sc_w', S.weights);
  render();
  await cloudLogW(date, w);
}

async function delW(date) {
  S.weights = S.weights.filter(x=>x.date!==date);
  LS.set('sc_w', S.weights);
  render();
  await cloudDelW(date);
}

/* Water toggle — also syncs to cloud */
/* Water — +/- buttons call this */
function adjustWater(delta) {
  const wg = waterGoal();
  const cur = waterCups();
  const next = Math.max(0, Math.min(wg, cur + delta));
  S.water[S.mdate] = next;
  LS.set('sc_wa', S.water);
  render();
  cloudSetWater(S.mdate, next);
}


/* ─── CHARTS ──────────────────────────────────────────────────────────────── */
function ic() { if(S.view==='dashboard') dC(); if(S.view==='weight') wC(); }

function bDS(data) {
  if (!data.length) return {labels:[],datasets:[]};
  const first=data[0].w, fd2=new Date(data[0].date);
  const tgt = data.map(x => +(first - RATET * Math.round((new Date(x.date)-fd2)/864e5)).toFixed(2));
  const ptC = data.map((x,i) => i===0?'#0066FF': x.w<data[i-1].w?'#22C55E': x.w>data[i-1].w?'#FF3B30':'#0066FF');
  return {
    labels: data.map(x=>x.date.slice(5)),
    datasets:[
      {label:'Daily weight', data:data.map(x=>x.w), borderColor:'#0066FF', borderWidth:1.8, pointRadius:3, pointHoverRadius:6, pointBackgroundColor:ptC, pointBorderColor:ptC, pointHoverBackgroundColor:ptC, tension:.25, fill:true, backgroundColor:'#0066FF0A'},
      {label:'Target',       data:tgt,                borderColor:'#F59E0B', borderWidth:1.5, borderDash:[5,4], pointRadius:0, pointHoverRadius:0, tension:.3,   fill:false},
      {label:'Goal',         data:data.map(()=>GOAL), borderColor:'#22C55E', borderWidth:1,   borderDash:[3,6], pointRadius:0, pointHoverRadius:0, tension:0,    fill:false},
    ]
  };
}

function mO(aw) {
  return {...CG, scales:{...CG.scales, y:{...CG.scales.y, min:Math.min(GOAL-1,...aw)-0.5, max:Math.max(...aw)+0.5}}};
}
function dC() {
  const el=document.getElementById('ch-d'); if(!el) return;
  const s=sW(); if(!s.length) return;
  const {labels,datasets}=bDS(s);
  CH['d']=new Chart(el,{type:'line',data:{labels,datasets},options:mO(s.map(x=>x.w))});
}
function wC() {
  const el=document.getElementById('ch-w'); if(!el) return;
  const fw=fW(); if(!fw.length) return;
  const {labels,datasets}=bDS(fw);
  CH['w']=new Chart(el,{type:'line',data:{labels,datasets},options:mO(fw.map(x=>x.w))});
}

boot();
</script>
</body>
</html>
